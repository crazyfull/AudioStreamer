# RavAva Demo Linux — AppImage (Qt bundled)
# Build inside Ubuntu 20.04 so glibc ≈ 2.31 (runs on 20.04+).
# x86_64 + arm64. No 32-bit x86 (Qt 6 has no kit).
name: Build Demo Linux

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag for GitHub Release (e.g. v1.0.0). Leave empty to skip release."
        required: false
        default: ""
      prerelease:
        description: "Mark as prerelease"
        type: boolean
        default: true

env:
  OPUS_VERSION: "1.6.1"
  WEBRTC_VERSION: "1.3"
  QT_VERSION: "6.8.3"
  DEBIAN_FRONTEND: noninteractive

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ubuntu:20.04
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            qt_host: linux
            qt_arch: linux_gcc_64
            ld_arch: x86_64
          - arch: arm64
            runner: ubuntu-22.04-arm
            qt_host: linux_arm64
            qt_arch: linux_gcc_arm64
            ld_arch: aarch64

    permissions:
      contents: write

    steps:
      - name: Install OS packages (Ubuntu 20.04)
        run: |
          apt-get update
          apt-get install -y \
            sudo curl ca-certificates gnupg software-properties-common \
            build-essential cmake ninja-build pkg-config \
            python3 python3-pip python3-setuptools python3-wheel \
            git file unzip zip \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-randr0 \
            libdbus-1-dev libfontconfig1-dev libfreetype6-dev \
            libssl-dev libfuse2

          # Ubuntu 20.04 has no libxcb-cursor package in default repos on some images;
          # ignore if missing (Qt may still run with xcb without cursor package at build time)
          apt-get install -y libxcb-cursor0 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} (${{ matrix.arch }})
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          aqtversion: ">=3.3.0"
          host: ${{ matrix.qt_host }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          dir: ${{ runner.temp }}
          cache: true
          install-deps: "false"

      - name: Build Opus (static, ${{ matrix.arch }})
        run: |
          set -euo pipefail
          OPUS_FILE="opus-${OPUS_VERSION}.tar.gz"
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
               --connect-timeout 20 --max-time 180 \
               -o opus.tar.gz \
               "https://downloads.xiph.org/releases/opus/${OPUS_FILE}"; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --max-time 180 \
                 -o opus.tar.gz \
                 "https://ftp.osuosl.org/pub/xiph/releases/opus/${OPUS_FILE}"
          fi
          tar xf opus.tar.gz

          cmake -S "opus-${OPUS_VERSION}" -B opus-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/opus-install" \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_BUILD_TESTING=OFF \
              -DOPUS_INSTALL_PKG_CONFIG_MODULE=OFF
          cmake --build opus-build --parallel "$(nproc)"
          cmake --install opus-build
          ls -l opus-install/lib

      - name: Cache webrtc-audio-processing
        id: webrtc_cache
        uses: actions/cache@v4
        with:
          path: webrtc-install
          key: webrtc-${{ env.WEBRTC_VERSION }}-linux-${{ matrix.arch }}-u20-v1

      - name: Build webrtc-audio-processing (static, ${{ matrix.arch }})
        if: steps.webrtc_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          pip3 install meson ninja
          WFILE="webrtc-audio-processing-${WEBRTC_VERSION}.tar.xz"
          mkdir -p webrtc-src
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
               --connect-timeout 20 --max-time 300 \
               -o webrtc.tar.xz \
               "https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/${WFILE}"; then
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --max-time 300 \
                 -o webrtc.tar.xz \
                 "https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v${WEBRTC_VERSION}/webrtc-audio-processing-v${WEBRTC_VERSION}.tar.gz"
          fi
          tar xf webrtc.tar.xz -C webrtc-src --strip-components=1

          WORK="$GITHUB_WORKSPACE/webrtc-work"
          OUT="$GITHUB_WORKSPACE/webrtc-install"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT/lib" "$OUT/include"

          meson setup "$WORK/b" webrtc-src --buildtype=release --default-library=static
          meson compile -C "$WORK/b"

          MAIN="$(find "$WORK/b" -name 'libwebrtc-audio-processing-1.a' | head -n1)"
          [ -n "$MAIN" ] || { echo "libwebrtc-audio-processing-1.a not found"; find "$WORK/b" -name '*.a'; exit 1; }

          {
            echo "create $OUT/lib/libwebrtc_apm.a"
            echo "addlib $MAIN"
            find "$WORK/b/subprojects" -name '*.a' 2>/dev/null | sort | while read -r f; do echo "addlib $f"; done
            echo "save"
            echo "end"
          } > "$WORK/merge.mri"
          ar -M < "$WORK/merge.mri"
          ranlib "$OUT/lib/libwebrtc_apm.a"

          (cd webrtc-src/webrtc && find . -name '*.h' -print0 | xargs -0 -I{} install -D -m 0644 {} "$OUT/include/{}")
          ABSL="$(find webrtc-src/subprojects -maxdepth 1 -type d -name 'abseil-cpp-*' | head -n1)"
          [ -n "$ABSL" ] && (cd "$ABSL" && find absl \( -name '*.h' -o -name '*.inc' \) -print0 | xargs -0 -I{} install -D -m 0644 {} "$OUT/include/{}")

          rm -rf "$WORK"
          ls -l "$OUT/lib"

      - name: Is webrtc available?
        id: webrtc
        run: |
          if [ -f webrtc-install/lib/libwebrtc_apm.a ]; then
            echo "root=$GITHUB_WORKSPACE/webrtc-install" >> "$GITHUB_OUTPUT"
            echo "status=ON" >> "$GITHUB_OUTPUT"
          else
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "status=OFF" >> "$GITHUB_OUTPUT"
            echo "::warning::webrtc not built for ${{ matrix.arch }}: no echo cancellation"
          fi

      - name: Configure
        run: |
          qt-cmake -S build-demo/linux -B build-linux \
              -DCMAKE_BUILD_TYPE=Release \
              -DOPUS_ROOT="$GITHUB_WORKSPACE/opus-install" \
              -DWEBRTC_ROOT="${{ steps.webrtc.outputs.root }}"

      - name: Build
        run: cmake --build build-linux --parallel "$(nproc)"

      - name: Verify binary
        id: verify
        run: |
          set -euo pipefail
          exe="build-linux/out/RavAva_Demo"
          test -x "$exe" || { echo "binary missing"; find build-linux -type f -name 'RavAva_Demo*'; exit 1; }
          echo "== size =="; ls -lh "$exe"
          echo "== file =="; file "$exe"
          echo "== ldd =="; ldd "$exe" | head -40
          if ldd "$exe" | grep -iE 'libopus\.so|libwebrtc'; then
            echo "unexpected dynamic opus/webrtc"; exit 1
          fi
          echo "exe=$exe" >> "$GITHUB_OUTPUT"

      - name: Setup linuxdeploy (extract, no FUSE)
        run: |
          set -euo pipefail
          LD_ARCH="${{ matrix.ld_arch }}"

          curl -fL --retry 5 -o linuxdeploy.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${LD_ARCH}.AppImage"
          curl -fL --retry 5 -o linuxdeploy-plugin-qt.AppImage \
            "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${LD_ARCH}.AppImage"
          chmod +x linuxdeploy.AppImage linuxdeploy-plugin-qt.AppImage

          ./linuxdeploy.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-root

          ./linuxdeploy-plugin-qt.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-plugin-qt-root

          mkdir -p "$GITHUB_WORKSPACE/tools"
          cat > "$GITHUB_WORKSPACE/tools/linuxdeploy-plugin-qt" <<EOF
          #!/bin/bash
          exec "$GITHUB_WORKSPACE/linuxdeploy-plugin-qt-root/AppRun" "\$@"
          EOF
          chmod +x "$GITHUB_WORKSPACE/tools/linuxdeploy-plugin-qt"
          echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"
          echo "LINUXDEPLOY=$GITHUB_WORKSPACE/linuxdeploy-root/AppRun" >> "$GITHUB_ENV"

      - name: Package AppImage
        run: |
          set -euo pipefail
          exe="${{ steps.verify.outputs.exe }}"
          test -x "$exe"

          APPDIR="$GITHUB_WORKSPACE/AppDir"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps"

          cp "$exe" "$APPDIR/usr/bin/RavAva_Demo"

          cat > "$APPDIR/usr/share/applications/RavAva_Demo.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=RavAva Demo
          Comment=RavAva audio demo
          Exec=RavAva_Demo
          Icon=RavAva_Demo
          Categories=AudioVideo;Audio;
          Terminal=false
          EOF

          if [ -f "$GITHUB_WORKSPACE/resource/icon.png" ]; then
            cp "$GITHUB_WORKSPACE/resource/icon.png" \
               "$APPDIR/usr/share/icons/hicolor/256x256/apps/RavAva_Demo.png"
          else
            python3 - <<'PY'
          import struct, zlib, pathlib
          def png(w, h, rgb=(0x2d, 0x6a, 0xbf)):
              def chunk(t, d):
                  return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xFFFFFFFF)
              raw = b"".join(b"\x00" + bytes(rgb) * w for _ in range(h))
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw, 9))
                  + chunk(b"IEND", b"")
              )
          pathlib.Path("AppDir/usr/share/icons/hicolor/256x256/apps/RavAva_Demo.png").write_bytes(png(256, 256))
          PY
          fi

          export QMAKE="${QT_ROOT_DIR}/bin/qmake"
          export PATH="${QT_ROOT_DIR}/bin:${PATH}"

          "$LINUXDEPLOY" --appdir "$APPDIR" \
              --executable "$APPDIR/usr/bin/RavAva_Demo" \
              --desktop-file "$APPDIR/usr/share/applications/RavAva_Demo.desktop" \
              --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/RavAva_Demo.png" \
              --plugin qt \
              --output appimage

          APPIMG="$(ls -1 RavAva_Demo*.AppImage 2>/dev/null | head -n1 || true)"
          if [ -z "$APPIMG" ]; then
            APPIMG="$(find . -maxdepth 2 -type f -name '*.AppImage' ! -name 'linuxdeploy*' | head -n1)"
          fi
          test -n "$APPIMG" && test -f "$APPIMG"

          name="RavAva_Demo-linux-${{ matrix.arch }}"
          mv "$APPIMG" "${name}.AppImage"
          chmod +x "${name}.AppImage"
          ls -lh "${name}.AppImage"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.AppImage
          retention-days: 30
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [linux]
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.release_tag != '' }}
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: RavAva_Demo-linux-*
          path: dist
          merge-multiple: true

      - name: Prepare upload
        run: |
          set -euo pipefail
          find dist -type f | sort
          mkdir -p upload
          find dist -type f -name 'RavAva_Demo-linux-*.AppImage' -exec cp -v {} upload/ \;
          ls -lh upload/
          test "$(ls -1 upload/*.AppImage 2>/dev/null | wc -l)" -ge 1

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            NOTES="## RavAva Demo — Linux (AppImage)

          - **Arch**: x86_64, arm64
          - **Built on**: Ubuntu 20.04 (glibc 2.31 baseline)
          - **Runs on**: Ubuntu 20.04+ / equivalent
          - **Qt**: ${{ env.QT_VERSION }} (bundled)
          - **Opus**: static ${{ env.OPUS_VERSION }}
          - **WebRTC**: when the build step succeeds

          \`\`\`bash
          chmod +x RavAva_Demo-linux-*.AppImage
          ./RavAva_Demo-linux-*.AppImage
          \`\`\`
          "
            EXTRA=()
            if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then EXTRA+=(--prerelease); fi
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "RavAva Demo Linux $TAG" --notes "$NOTES" "${EXTRA[@]}"
          fi
          gh release upload "$TAG" upload/*.AppImage --repo "${{ github.repository }}" --clobber
          gh release view "$TAG" --repo "${{ github.repository }}"
