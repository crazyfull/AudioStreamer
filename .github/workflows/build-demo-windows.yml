name: Build Demo Windows (static)

on:
  workflow_dispatch:

jobs:
  windows-x64-static:
    name: Windows x64 static (no WebRTC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static Qt
        uses: AllanChain/install-qt-static@v6.12.0-1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # Locate Qt, qmake and MSVC mkspec
      # --------------------------------------------------
            - name: Debug Qt installation
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake -ErrorAction Stop).Source
          $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent

          Write-Host "========== QMAKE =========="
          Write-Host $qmake

          Write-Host "========== QT ROOT =========="
          Write-Host $qtRoot

          Write-Host "========== QMAKE QUERY =========="
          & $qmake -query

          Write-Host "========== QT ROOT CONTENTS =========="
          Get-ChildItem $qtRoot -Force |
              Select-Object Name, FullName

          Write-Host "========== BIN CONTENTS =========="
          Get-ChildItem (Join-Path $qtRoot "bin") -Force |
              Select-Object -First 30 Name

          Write-Host "========== SEARCH MKSPECS =========="
          Get-ChildItem $qtRoot -Directory -Recurse -Filter mkspecs -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

          Write-Host "========== SEARCH QMAKE.CONF =========="
          Get-ChildItem $qtRoot -File -Recurse -Filter qmake.conf -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

          Write-Host "========== OTHER QT INSTALL PATH =========="
          $otherRoot = "D:\a\install-qt-static\install-qt-static\qt_static"

          if (Test-Path $otherRoot) {
              Get-ChildItem $otherRoot -Force |
                  Select-Object Name, FullName
          } else {
              Write-Host "QT_INSTALL_DATA path does not exist"
          }

      # --------------------------------------------------
      # Configure
      # --------------------------------------------------
      - name: Configure
        shell: cmd
        env:
          QMAKE_EXE: ${{ steps.qt.outputs.qmake }}
          SPEC_PATH: ${{ steps.qt.outputs.spec_path }}
          QT_BIN: ${{ steps.qt.outputs.qt_bin }}
        run: |
          echo ======================================
          echo QMAKE_EXE=%QMAKE_EXE%
          echo SPEC_PATH=%SPEC_PATH%
          echo QT_BIN=%QT_BIN%
          echo ======================================

          if not exist "%QMAKE_EXE%" (
              echo ERROR: qmake.exe not found
              exit /b 1
          )

          if not exist "%SPEC_PATH%\qmake.conf" (
              echo ERROR: qmake.conf not found
              exit /b 1
          )

          if not exist build-demo mkdir build-demo

          cd build-demo

          set "PATH=%QT_BIN%;%PATH%"
          set "QMAKESPEC=%SPEC_PATH%"

          "%QMAKE_EXE%" ..\RavAva-Demo.pro ^
            -spec "%SPEC_PATH%" ^
            CONFIG+=release ^
            CONFIG+=no_webrtc ^
            "TARGET=RavAva_Demo" ^
            "DESTDIR=$$PWD/out"

          if errorlevel 1 exit /b 1

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        shell: cmd
        env:
          QT_BIN: ${{ steps.qt.outputs.qt_bin }}
        run: |
          set "PATH=%QT_BIN%;%PATH%"

          cd build-demo

          nmake /nologo

          if errorlevel 1 exit /b 1

      # --------------------------------------------------
      # Locate and verify executable
      # --------------------------------------------------
      - name: Locate and verify single EXE
        id: find_exe
        shell: pwsh
        run: |
          $candidates = @(
              "build-demo/out/RavAva_Demo.exe",
              "build-demo/release/RavAva_Demo.exe",
              "build-demo/RavAva_Demo.exe",
              "RavAva_Demo.exe"
          )

          $found = $null

          foreach ($path in $candidates) {
              if (Test-Path $path) {
                  $found = (Resolve-Path $path).Path
                  break
              }
          }

          if (-not $found) {
              Write-Host "Searching for any EXE..."

              Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName

              throw "Demo executable not found"
          }

          Write-Host "Found: $found"

          $sizeMB = [math]::Round(
              (Get-Item $found).Length / 1MB, 2
          )

          Write-Host "Size: $sizeMB MB"

          $dump = & dumpbin /dependents $found 2>$null

          if ($dump) {
              Write-Host "========== DLL Dependencies =========="

              $dump |
                  Select-String -Pattern "\.dll" |
                  ForEach-Object { Write-Host $_.Line }

              if ($dump -match "Qt6") {
                  throw "Qt DLLs still linked - static Qt was not used"
              }
          }

          "exe=$found" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # Package
      # --------------------------------------------------
      - name: Package
        shell: pwsh
        run: |
          $exe = "${{ steps.find_exe.outputs.exe }}"

          $dist = "dist/RavAva_Demo-windows-x64-static"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item $exe (Join-Path $dist "RavAva_Demo.exe")

          @"
          RavAva Demo - Windows x64 STATIC
          --------------------------------

          Qt: static (AllanChain/install-qt-static)
          Opus: static (libs/opus/win32)
          CRT: /MT
          WebRTC / AEC: OFF

          Single executable.
          No Qt installation or additional Qt DLLs required.

          Run: RavAva_Demo.exe
          "@ | Set-Content (Join-Path $dist "README.txt") -Encoding UTF8

          Compress-Archive `
              -Path $dist `
              -DestinationPath "RavAva_Demo-windows-x64-static.zip" `
              -Force

          Get-Item "RavAva_Demo-windows-x64-static.zip" |
              Format-List Name, Length

      # --------------------------------------------------
      # Upload artifact
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavAva_Demo-windows-x64-static
          path: RavAva_Demo-windows-x64-static.zip
          retention-days: 30
          if-no-files-found: error
          
      - name: Debug Qt installation
        shell: pwsh
        run: |
          Write-Host "GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          Write-Host "GITHUB_ACTION_PATH=$env:GITHUB_ACTION_PATH"

          Write-Host "Searching qmake.exe:"
          Get-ChildItem D:\a -Filter qmake.exe -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName

          Write-Host "Searching mkspecs:"
          Get-ChildItem D:\a -Directory -Filter mkspecs -Recurse -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName
