name: Build Demo Windows (static)

on:
  workflow_dispatch:

jobs:
  windows-x64-static:
    name: Windows x64 static (no WebRTC)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install static Qt
        uses: AllanChain/install-qt-static@v6.12.0-1

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --------------------------------------------------
      # Locate Qt, qmake and MSVC mkspec
      # --------------------------------------------------
      - name: Locate Qt and MSVC mkspec
        id: qt
        shell: pwsh
        run: |
          $qmake = (Get-Command qmake -ErrorAction Stop).Source
          $qtBin = Split-Path $qmake -Parent

          Write-Host "======================================"
          Write-Host "QMAKE: $qmake"
          Write-Host "QT BIN: $qtBin"
          Write-Host "======================================"

          $dataPaths = @(
              (& $qmake -query QT_INSTALL_DATA).Trim(),
              (& $qmake -query QT_INSTALL_ARCHDATA).Trim(),
              (& $qmake -query QT_HOST_DATA).Trim()
          ) | Where-Object { $_ } | Select-Object -Unique

          Write-Host "Qt data paths:"
          foreach ($path in $dataPaths) {
              Write-Host "  $path"
          }

          $specDir = $null

          foreach ($root in $dataPaths) {
              $mkspecs = Join-Path $root "mkspecs"

              if (-not (Test-Path $mkspecs)) {
                  continue
              }

              Write-Host "Searching: $mkspecs"

              $spec = Get-ChildItem $mkspecs -Directory |
                  Where-Object { $_.Name -like "win32-msvc*" } |
                  Select-Object -First 1

              if ($spec) {
                  $candidate = Join-Path $spec.FullName "qmake.conf"

                  if (Test-Path $candidate) {
                      $specDir = $spec.FullName
                      break
                  }
              }
          }

          if (-not $specDir) {
              Write-Host "Available mkspecs:"
              foreach ($root in $dataPaths) {
                  $mkspecs = Join-Path $root "mkspecs"
                  if (Test-Path $mkspecs) {
                      Get-ChildItem $mkspecs -Directory |
                          Select-Object -ExpandProperty Name
                  }
              }

              throw "Could not locate win32-msvc mkspec"
          }

          Write-Host "======================================"
          Write-Host "Selected mkspec: $specDir"
          Write-Host "======================================"

          "qmake=$qmake" >> $env:GITHUB_OUTPUT
          "qt_bin=$qtBin" >> $env:GITHUB_OUTPUT
          "spec_path=$specDir" >> $env:GITHUB_OUTPUT

          & $qmake -v
          if ($LASTEXITCODE -ne 0) {
              throw "qmake -v failed"
          }

          & $qmake -query
          if ($LASTEXITCODE -ne 0) {
              throw "qmake -query failed"
          }

      # --------------------------------------------------
      # Configure
      # --------------------------------------------------
      - name: Configure
        shell: cmd
        env:
          QMAKE_EXE: ${{ steps.qt.outputs.qmake }}
          SPEC_PATH: ${{ steps.qt.outputs.spec_path }}
          QT_BIN: ${{ steps.qt.outputs.qt_bin }}
        run: |
          echo ======================================
          echo QMAKE_EXE=%QMAKE_EXE%
          echo SPEC_PATH=%SPEC_PATH%
          echo QT_BIN=%QT_BIN%
          echo ======================================

          if not exist "%QMAKE_EXE%" (
              echo ERROR: qmake.exe not found
              exit /b 1
          )

          if not exist "%SPEC_PATH%\qmake.conf" (
              echo ERROR: qmake.conf not found
              exit /b 1
          )

          if not exist build-demo mkdir build-demo

          cd build-demo

          set "PATH=%QT_BIN%;%PATH%"
          set "QMAKESPEC=%SPEC_PATH%"

          "%QMAKE_EXE%" ..\RavAva-Demo.pro ^
            -spec "%SPEC_PATH%" ^
            CONFIG+=release ^
            CONFIG+=no_webrtc ^
            "TARGET=RavAva_Demo" ^
            "DESTDIR=$$PWD/out"

          if errorlevel 1 exit /b 1

      # --------------------------------------------------
      # Build
      # --------------------------------------------------
      - name: Build
        shell: cmd
        env:
          QT_BIN: ${{ steps.qt.outputs.qt_bin }}
        run: |
          set "PATH=%QT_BIN%;%PATH%"

          cd build-demo

          nmake /nologo

          if errorlevel 1 exit /b 1

      # --------------------------------------------------
      # Locate and verify executable
      # --------------------------------------------------
      - name: Locate and verify single EXE
        id: find_exe
        shell: pwsh
        run: |
          $candidates = @(
              "build-demo/out/RavAva_Demo.exe",
              "build-demo/release/RavAva_Demo.exe",
              "build-demo/RavAva_Demo.exe",
              "RavAva_Demo.exe"
          )

          $found = $null

          foreach ($path in $candidates) {
              if (Test-Path $path) {
                  $found = (Resolve-Path $path).Path
                  break
              }
          }

          if (-not $found) {
              Write-Host "Searching for any EXE..."

              Get-ChildItem -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
                  Select-Object -ExpandProperty FullName

              throw "Demo executable not found"
          }

          Write-Host "Found: $found"

          $sizeMB = [math]::Round(
              (Get-Item $found).Length / 1MB, 2
          )

          Write-Host "Size: $sizeMB MB"

          $dump = & dumpbin /dependents $found 2>$null

          if ($dump) {
              Write-Host "========== DLL Dependencies =========="

              $dump |
                  Select-String -Pattern "\.dll" |
                  ForEach-Object { Write-Host $_.Line }

              if ($dump -match "Qt6") {
                  throw "Qt DLLs still linked - static Qt was not used"
              }
          }

          "exe=$found" >> $env:GITHUB_OUTPUT

      # --------------------------------------------------
      # Package
      # --------------------------------------------------
      - name: Package
        shell: pwsh
        run: |
          $exe = "${{ steps.find_exe.outputs.exe }}"

          $dist = "dist/RavAva_Demo-windows-x64-static"

          New-Item -ItemType Directory -Force -Path $dist | Out-Null

          Copy-Item $exe (Join-Path $dist "RavAva_Demo.exe")

          @"
          RavAva Demo - Windows x64 STATIC
          --------------------------------

          Qt: static (AllanChain/install-qt-static)
          Opus: static (libs/opus/win32)
          CRT: /MT
          WebRTC / AEC: OFF

          Single executable.
          No Qt installation or additional Qt DLLs required.

          Run: RavAva_Demo.exe
          "@ | Set-Content (Join-Path $dist "README.txt") -Encoding UTF8

          Compress-Archive `
              -Path $dist `
              -DestinationPath "RavAva_Demo-windows-x64-static.zip" `
              -Force

          Get-Item "RavAva_Demo-windows-x64-static.zip" |
              Format-List Name, Length

      # --------------------------------------------------
      # Upload artifact
      # --------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavAva_Demo-windows-x64-static
          path: RavAva_Demo-windows-x64-static.zip
          retention-days: 30
          if-no-files-found: error
