# RavAva Demo for macOS, STATIC: Qt (static, AllanChain/install-qt-static) + Opus (built from source, static).
# Run it from the Actions tab ("Build Demo macOS (static)" -> "Run workflow").
# Result: three artifacts
#   RavAva_Demo-macos-arm64-static      Apple Silicon (M1/M2/M3/M4)
#   RavAva_Demo-macos-x86_64-static     Intel
#   RavAva_Demo-macos-universal-static  both in one app (lipo), runs natively on either
# Each is a zipped RavAva_Demo.app with no Qt / Opus to install. The app is ad-hoc signed (no Apple developer account), so the first
# launch needs: right click -> Open, or `xattr -cr RavAva_Demo.app` (the README inside the zip says so).
name: Build Demo macOS (static)

on:
  workflow_dispatch:

env:
  OPUS_VERSION: "1.5.2"

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest          # Apple Silicon
          - arch: x86_64
            runner: macos-15-intel        # Intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Opus: built natively for this CPU (its SIMD detection must see the real target, so no "universal" build here)
      - name: Build Opus (static)
        run: |
          curl -fsSL -o opus.tar.gz "https://downloads.xiph.org/releases/opus/opus-${OPUS_VERSION}.tar.gz"
          tar xf opus.tar.gz
          cmake -S "opus-${OPUS_VERSION}" -B opus-build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
                -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/opus-install" \
                -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
                -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_INSTALL_PKG_CONFIG_MODULE=OFF
          cmake --build opus-build --parallel 4
          cmake --install opus-build
          lipo -info opus-install/lib/libopus.a

      # The macOS static Qt is a universal build (x86_64 + arm64); we link only the slice of this CPU
      - name: Install static Qt
        uses: AllanChain/install-qt-static@v6.12.0-1

      - name: Configure
        run: |
          qt-cmake -S build-demo/macos -B build-macos \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
                -DOPUS_ROOT="$GITHUB_WORKSPACE/opus-install"

      - name: Build
        run: cmake --build build-macos --parallel 4

      - name: Verify app
        id: verify
        run: |
          app="build-macos/out/RavAva_Demo.app"
          exe="$app/Contents/MacOS/RavAva_Demo"
          test -x "$exe" || { echo "RavAva_Demo.app was not generated"; find build-macos -name "*.app" -maxdepth 3; exit 1; }
          echo "== size =="; du -sh "$app"
          echo "== architectures =="; lipo -info "$exe"
          echo "== dynamic dependencies =="; otool -L "$exe"
          if otool -L "$exe" | grep -i -E "Qt[A-Za-z0-9]*\.framework|libQt|libopus"; then
            echo "Dynamic Qt / Opus dependency detected"; exit 1
          fi
          test -f "$app/Contents/Info.plist" && plutil -p "$app/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription \
            || { echo "NSMicrophoneUsageDescription missing in Info.plist"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Package
        run: |
          name="RavAva_Demo-macos-${{ matrix.arch }}-static"
          mkdir -p "dist/$name"
          cp -R "${{ steps.verify.outputs.app }}" "dist/$name/RavAva_Demo.app"
          codesign --force --deep -s - "dist/$name/RavAva_Demo.app"      # ad-hoc: Apple Silicon refuses unsigned code
          cat > "dist/$name/README.txt" <<TXT
          RavAva Demo - macOS ${{ matrix.arch }} STATIC
          --------------------------------------------
          Qt: static 6.12     Opus: static ${OPUS_VERSION}     WebRTC: OFF
          No Qt / Opus to install.

          The app is not notarized. First launch: right click RavAva_Demo.app -> Open -> Open,
          or in Terminal:  xattr -cr RavAva_Demo.app
          Allow the microphone when macOS asks (System Settings -> Privacy & Security -> Microphone).
          TXT
          (cd dist && ditto -c -k --keepParent "$name" "../$name.zip")
          ls -l "$name.zip"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip
          retention-days: 30
          if-no-files-found: error

  universal:
    name: macOS universal
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RavAva_Demo-macos-*-static
          path: parts

      - name: Join arm64 + x86_64 (lipo)
        run: |
          name="RavAva_Demo-macos-universal-static"
          mkdir -p work "dist/$name"
          for a in arm64 x86_64; do
            ditto -x -k "parts/RavAva_Demo-macos-$a-static/RavAva_Demo-macos-$a-static.zip" "work/$a"
          done
          cp -R "work/arm64/RavAva_Demo-macos-arm64-static/RavAva_Demo.app" "dist/$name/RavAva_Demo.app"
          lipo -create \
               "work/arm64/RavAva_Demo-macos-arm64-static/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" \
               "work/x86_64/RavAva_Demo-macos-x86_64-static/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" \
               -output "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo"
          lipo -info "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo"
          codesign --force --deep -s - "dist/$name/RavAva_Demo.app"       # the signature of the arm64 copy is void after lipo
          codesign --verify --deep --strict "dist/$name/RavAva_Demo.app"
          cp "work/arm64/RavAva_Demo-macos-arm64-static/README.txt" "dist/$name/README.txt"
          sed -i '' 's/macOS arm64 STATIC/macOS universal (arm64 + x86_64) STATIC/' "dist/$name/README.txt"
          (cd dist && ditto -c -k --keepParent "$name" "../$name.zip")
          ls -l "$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavAva_Demo-macos-universal-static
          path: RavAva_Demo-macos-universal-static.zip
          retention-days: 30
          if-no-files-found: error
