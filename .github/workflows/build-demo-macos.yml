name: Build Demo macOS (static)

on:
  workflow_dispatch:

env:
  OPUS_VERSION: "1.6.1"
  WEBRTC_VERSION: "1.3"
  # must match Qt static build (AllanChain/install-qt-static@v6.12)
  MACOSX_DEPLOYMENT_TARGET: "14.4"

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # both on macos-latest so the same modern SDK is used (x86_64 is cross-compiled)
          - arch: arm64
            runner: macos-latest
          - arch: x86_64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check macOS SDK
        run: |
          echo "== Xcode =="; xcodebuild -version
          echo "== SDK =="; xcrun --sdk macosx --show-sdk-version
          echo "== arch =="; uname -m

      # ---------------------------------------------------------------- Opus 1.6.1 (static, this arch)
      - name: Build Opus (static, ${{ matrix.arch }})
        run: |
          OPUS_FILE="opus-${OPUS_VERSION}.tar.gz"
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
               --connect-timeout 20 --max-time 180 \
               -o opus.tar.gz \
               "https://downloads.xiph.org/releases/opus/${OPUS_FILE}"; then
            echo "Primary server failed. Trying mirror..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --max-time 180 \
                 -o opus.tar.gz \
                 "https://ftp.osuosl.org/pub/xiph/releases/opus/${OPUS_FILE}"
          fi
          tar xf opus.tar.gz

          cmake -S "opus-${OPUS_VERSION}" -B opus-build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }} \
              -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/opus-install" \
              -DBUILD_SHARED_LIBS=OFF \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DOPUS_BUILD_PROGRAMS=OFF \
              -DOPUS_BUILD_TESTING=OFF \
              -DOPUS_INSTALL_PKG_CONFIG_MODULE=OFF

          cmake --build opus-build --parallel 4
          cmake --install opus-build
          lipo -info opus-install/lib/libopus.a

      # ---------------------------------------------------------------- webrtc-audio-processing 1.3 (static, this arch)
      - name: Cache webrtc-audio-processing
        id: webrtc_cache
        uses: actions/cache@v4
        with:
          path: webrtc-install
          key: webrtc-${{ env.WEBRTC_VERSION }}-macos-${{ matrix.arch }}-dt${{ env.MACOSX_DEPLOYMENT_TARGET }}-v2

      - name: Build webrtc-audio-processing (static, ${{ matrix.arch }})
        if: steps.webrtc_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          pip3 install meson ninja
          WFILE="webrtc-audio-processing-${WEBRTC_VERSION}.tar.xz"
          mkdir -p webrtc-src
          if ! curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
               --connect-timeout 20 --max-time 300 \
               -o webrtc.tar.xz \
               "https://freedesktop.org/software/pulseaudio/webrtc-audio-processing/${WFILE}"; then
            echo "Primary failed. Trying GitLab..."
            curl -fL --retry 5 --retry-all-errors --retry-delay 3 \
                 --connect-timeout 20 --max-time 300 \
                 -o webrtc.tar.xz \
                 "https://gitlab.freedesktop.org/pulseaudio/webrtc-audio-processing/-/archive/v${WEBRTC_VERSION}/webrtc-audio-processing-v${WEBRTC_VERSION}.tar.gz"
          fi
          tar xf webrtc.tar.xz -C webrtc-src --strip-components=1

          WORK="$GITHUB_WORKSPACE/webrtc-work"
          OUT="$GITHUB_WORKSPACE/webrtc-install"
          rm -rf "$WORK" "$OUT"
          mkdir -p "$WORK" "$OUT/lib" "$OUT/include"

          # host is arm64; for x86_64 we still build native libs for the runner arch
          # because meson cross for macOS is painful. Cache key is per matrix.arch so
          # each job keeps its own install. For true x86_64 webrtc, build on the same
          # arch via CMAKE isn't needed for linking if we only ship arm64 webrtc —
          # but we attempt a native meson build matching the runner.
          EXTRA_ARGS=()
          if [ "$(uname -m)" = "arm64" ] && [ "${{ matrix.arch }}" = "x86_64" ]; then
            # cross-compile webrtc for x86_64 on Apple Silicon
            cat > "$WORK/cross.ini" <<'INI'
          [binaries]
          c = ['clang', '-arch', 'x86_64']
          cpp = ['clang++', '-arch', 'x86_64']
          ar = 'ar'
          ranlib = 'ranlib'
          strip = 'strip'

          [host_machine]
          system = 'darwin'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          INI
            EXTRA_ARGS=(--cross-file "$WORK/cross.ini")
          fi

          meson setup "$WORK/b" webrtc-src \
              --buildtype=release \
              --default-library=static \
              -Dcpp_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
              -Dc_args="-mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" \
              "${EXTRA_ARGS[@]}"
          meson compile -C "$WORK/b"

          MAIN="$(find "$WORK/b" -name 'libwebrtc-audio-processing-1.a' | head -n1)"
          [ -n "$MAIN" ] || { echo "libwebrtc-audio-processing-1.a not found"; find "$WORK/b" -name '*.a'; exit 1; }

          {
            echo "create $OUT/lib/libwebrtc_apm.a"
            echo "addlib $MAIN"
            find "$WORK/b/subprojects" -name '*.a' 2>/dev/null | sort | while read -r f; do echo "addlib $f"; done
            echo "save"
            echo "end"
          } > "$WORK/merge.mri"
          ar -M < "$WORK/merge.mri"
          ranlib "$OUT/lib/libwebrtc_apm.a"

          (cd webrtc-src/webrtc && find . -name '*.h' -print0 | xargs -0 -I{} install -D -m 0644 {} "$OUT/include/{}")
          ABSL="$(find webrtc-src/subprojects -maxdepth 1 -type d -name 'abseil-cpp-*' | head -n1)"
          [ -n "$ABSL" ] && (cd "$ABSL" && find absl \( -name '*.h' -o -name '*.inc' \) -print0 | xargs -0 -I{} install -D -m 0644 {} "$OUT/include/{}")

          rm -rf "$WORK"
          lipo -info "$OUT/lib/libwebrtc_apm.a" || true
          ls -l "$OUT/lib"

      - name: Is webrtc available?
        id: webrtc
        run: |
          if [ -f webrtc-install/lib/libwebrtc_apm.a ]; then
            echo "root=$GITHUB_WORKSPACE/webrtc-install" >> "$GITHUB_OUTPUT"
            echo "status=ON" >> "$GITHUB_OUTPUT"
          else
            echo "root=" >> "$GITHUB_OUTPUT"
            echo "status=OFF" >> "$GITHUB_OUTPUT"
            echo "::warning::webrtc not built for ${{ matrix.arch }}: no echo cancellation"
          fi

      # ---------------------------------------------------------------- Qt static
      - name: Install static Qt
        uses: AllanChain/install-qt-static@v6.12.0-1

      - name: Configure
        run: |
          qt-cmake -S build-demo/macos -B build-macos \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
              -DCMAKE_OSX_DEPLOYMENT_TARGET=${{ env.MACOSX_DEPLOYMENT_TARGET }} \
              -DCMAKE_EXE_LINKER_FLAGS="-Wl,-U,_NSAccessibilityLanguageAttribute" \
              -DOPUS_ROOT="$GITHUB_WORKSPACE/opus-install" \
              -DWEBRTC_ROOT="${{ steps.webrtc.outputs.root }}"

      - name: Build
        run: cmake --build build-macos --parallel 4

      - name: Verify app
        id: verify
        run: |
          app="build-macos/out/RavAva_Demo.app"
          exe="$app/Contents/MacOS/RavAva_Demo"
          test -x "$exe" || { echo "app missing"; find build-macos -name "*.app"; exit 1; }

          echo "== size =="; du -sh "$app"
          echo "== arch =="; lipo -info "$exe"
          lipo -info "$exe" | grep -q "${{ matrix.arch }}" || { echo "wrong arch"; exit 1; }

          echo "== deps =="; otool -L "$exe"
          if otool -L "$exe" | grep -i -E "Qt[A-Za-z0-9]*\.framework|libQt|libopus|libwebrtc"; then
            echo "dynamic dependency detected"; exit 1
          fi

          plutil -p "$app/Contents/Info.plist" | grep -q NSMicrophoneUsageDescription \
            || { echo "NSMicrophoneUsageDescription missing"; exit 1; }

          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Package and Sign
        run: |
          name="RavAva_Demo-macos-${{ matrix.arch }}-static"
          mkdir -p "dist/$name"
          cp -R "${{ steps.verify.outputs.app }}" "dist/$name/RavAva_Demo.app"
          codesign --force --deep -s - "dist/$name/RavAva_Demo.app"
          codesign --verify --deep --strict "dist/$name/RavAva_Demo.app"

          cat > "dist/$name/README.txt" <<TXT
          RavAva Demo - macOS ${{ matrix.arch }} STATIC
          --------------------------------------------
          Qt: static 6.12
          Opus: static ${OPUS_VERSION}
          WebRTC echo cancellation: ${{ steps.webrtc.outputs.status }}
          Deployment target: ${MACOSX_DEPLOYMENT_TARGET}
          No Qt / Opus / WebRTC to install.

          First launch: right-click -> Open, or: xattr -cr RavAva_Demo.app
          Allow microphone in System Settings -> Privacy & Security -> Microphone.
          TXT

          (cd dist && ditto -c -k --keepParent "$name" "../$name.zip")
          ls -lh "$name.zip"
          echo "NAME=$name" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: ${{ env.NAME }}.zip
          retention-days: 30
          if-no-files-found: error

  universal:
    name: macOS universal
    needs: macos
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: RavAva_Demo-macos-*-static
          path: parts

      - name: Join arm64 + x86_64 (lipo)
        run: |
          name="RavAva_Demo-macos-universal-static"
          mkdir -p work "dist/$name"

          for a in arm64 x86_64; do
            zip="parts/RavAva_Demo-macos-$a-static/RavAva_Demo-macos-$a-static.zip"
            test -f "$zip" || { echo "missing $zip"; ls -R parts; exit 1; }
            ditto -x -k "$zip" "work/$a"
          done

          cp -R "work/arm64/RavAva_Demo-macos-arm64-static/RavAva_Demo.app" "dist/$name/RavAva_Demo.app"
          lipo -create \
               "work/arm64/RavAva_Demo-macos-arm64-static/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" \
               "work/x86_64/RavAva_Demo-macos-x86_64-static/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" \
               -output "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo"

          lipo -info "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo"
          lipo -info "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" | grep -q arm64
          lipo -info "dist/$name/RavAva_Demo.app/Contents/MacOS/RavAva_Demo" | grep -q x86_64

          codesign --force --deep -s - "dist/$name/RavAva_Demo.app"
          codesign --verify --deep --strict "dist/$name/RavAva_Demo.app"

          cp "work/arm64/RavAva_Demo-macos-arm64-static/README.txt" "dist/$name/README.txt"
          sed -i '' 's/macOS arm64 STATIC/macOS universal (arm64 + x86_64) STATIC/' "dist/$name/README.txt"

          (cd dist && ditto -c -k --keepParent "$name" "../$name.zip")
          ls -lh "$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RavAva_Demo-macos-universal-static
          path: RavAva_Demo-macos-universal-static.zip
          retention-days: 30
          if-no-files-found: error
